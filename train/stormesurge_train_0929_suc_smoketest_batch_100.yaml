defaults:
- stormesurge_train_0929_suc_batch_100
- _self_

# Smoke test: shrink the split to a single year (1993) to verify the pipeline runs end-to-end.
dataloader:
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: null
    validation: null
    test: null
  training:
    datasets:
      data:
        start: 1993-01-01
        end: 1993-09-01
  validation:
    datasets:
      data:
        start: 1993-09-01
        end: 1993-11-01
  test:
    datasets:
      data:
        start: 1993-11-01
        end: 1994-01-01

# Bounded so the run actually completes (forward/backward/checkpoint/validation) instead of stopping at walltime.
training:
  max_epochs: 20
  max_steps: 30000

model:
  num_channels: 256

system:
  hardware:
    accelerator: gpu
    num_gpus_per_node: 2
    num_nodes: 1
    num_gpus_per_model: 2
  output:
    root: /home/osw001/data/ppp7/surge_anemoi_project/anemoi-stormsurge/train/output/ssh_atmos_global_1993_batch100


dates:
  start: 'YEAR_START-01-01T01:00:00'
  end: 'NEXT_YEAR-01-01T00:00:00'
  frequency: 1h
  missing: []

build:
  group_by: 100

statistics:
  allow_nans:
  - SSHT
  - ETAS

input:
  netcdf:
    path: /home/olh001/Python/anemoi-stormsurge/training-data/gdsps-hindcast/era5-grid/etas_ssht/etas_ssht_yYEAR_START.nc
    param: [SSHT, ETAS]
    flavour:
      rules:
        latitude:
          name: lat
        longitude:
          name: lon
        time:
          name: time
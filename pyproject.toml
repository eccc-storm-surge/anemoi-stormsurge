[project]
authors = [{name = "Nils Kristensen", email = ""}]
dependencies = ["anemoi-training", "anemoi-models", "anemoi-graphs", "anemoi-datasets"]
name = "anemoi-stormsurge"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", 
	"fortiers", 
	"file:///fs/site7/eccc/cmd/cmd_shared/slib800/conda-cmc/prod", 
	"https://conda.modular.com/max-nightly"]

platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
anemoi_stormsurge = { path = ".", editable = true }

[tool.pixi.tasks]
interp_ssh_orc12_toera5="ord_soumet training-data/scripts/launch_pyscript.sh -cpus 200 -cm 500G -mach ppp8 -t 21600 -jn interpolate-ssh.py -args $(pwd) training-data/scripts/interpolate-ssh.py"



[tool.pixi.dependencies]
aether = ">=2026.9.1,<2027"
ipython = ">=9.17.1,<10"

[project]
authors = [{name = "Nils Kristensen", email = ""}]
dependencies = ["anemoi-training>=0.13.0,<0.14", "anemoi-models>=0.19.0,<0.20", "anemoi-graphs>=0.9.7,<0.10", "anemoi-datasets>=0.5.34,<0.6"]
name = "anemoi-stormsurge"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.activation.env]
LD_LIBRARY_PATH = "${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
anemoi_stormsurge = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
datashader = ">=0.19.1,<0.20"
termcolor = ">=3.3.0,<4"
trimesh = ">=5.1.0,<6"
scipy = ">=1.18.1,<2"
libstdcxx-ng = ">=13"
